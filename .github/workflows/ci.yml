name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar, validar formato y ejecutar tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Publicar informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Formato
        working-directory: frontend
        run: npm run format:check

      - name: Tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build de producción
        working-directory: frontend
        run: npm run build

  flyway:
    name: Migraciones Flyway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mancomunidad
          MYSQL_USER: mancomunidad
          MYSQL_PASSWORD: mancomunidad
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -umancomunidad -pmancomunidad --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migraciones sobre MySQL efímero
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            -v "$GITHUB_WORKSPACE/backend/src/main/resources/db/dev:/flyway/sql-dev:ro" \
            flyway/flyway:11 \
            -url="jdbc:mysql://127.0.0.1:3306/mancomunidad?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -user=mancomunidad \
            -password=mancomunidad \
            -locations=filesystem:/flyway/sql,filesystem:/flyway/sql-dev \
            -connectRetries=30 \
            migrate

      - name: Comprobar que no quedan migraciones pendientes
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            -v "$GITHUB_WORKSPACE/backend/src/main/resources/db/dev:/flyway/sql-dev:ro" \
            flyway/flyway:11 \
            -url="jdbc:mysql://127.0.0.1:3306/mancomunidad?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -user=mancomunidad \
            -password=mancomunidad \
            -locations=filesystem:/flyway/sql,filesystem:/flyway/sql-dev \
            -connectRetries=30 \
            validate

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: mancomunidad-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: mancomunidad-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
